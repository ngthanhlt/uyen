<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Loading cycle…</title><style>
:root{--bg:#f4f1ea;--paper:#fffdf8;--ink:#17191d;--muted:#6f736f;--line:#d9d5ca;--accent:#a7372d}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}main{width:min(430px,calc(100% - 36px));padding:28px;background:var(--paper);border:1px solid var(--line);border-radius:16px;text-align:center}.dot{width:28px;height:28px;border:3px solid #ddd6ca;border-top-color:var(--accent);border-radius:50%;margin:0 auto 16px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}h1{font-size:20px;margin:0 0 8px}p{font-size:13px;color:var(--muted);line-height:1.5;margin:0}a{color:var(--accent);font-weight:750}</style></head><body><main><div class="dot" id="dot"></div><h1 id="title">Opening cycle</h1><p id="msg">Decrypting the approved study environment in this browser.</p></main><script>
const MAGIC='UYENBIN1',sessionKey='uyen.study.password';
function bytesToText(b){return new TextDecoder().decode(b)}
async function deriveKey(pw,salt,iters){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iters,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt'])}
async function parseEnvelope(buf){const b=new Uint8Array(buf);if(b.length<56||bytesToText(b.slice(0,8))!==MAGIC)throw new Error('Invalid encrypted file');const dv=new DataView(b.buffer,b.byteOffset,b.byteLength);return{iters:dv.getUint32(8,false),salt:b.slice(12,28),iv:b.slice(28,40),ct:b.slice(40)}}
function escapeAttr(value){return String(value).replace(/&/g,'&amp;').replace(/"/g,'&quot;')}
function prepareYouTubeForGitHub(html){
  const playerPage=new URL('../../shared/youtube-player.html',location.href).href;
  html=html.replace(/<iframe\b[^>]*\bdata-video-id="([^"]+)"[^>]*>/g,(tag,videoId)=>{
    const startMatch=tag.match(/\bsrc="[^"]*[?&]start=(\d+)/);
    const start=startMatch?startMatch[1]:'0';
    const src=playerPage+'#v='+encodeURIComponent(videoId)+'&start='+encodeURIComponent(start);
    return /\bsrc="[^"]*"/.test(tag)?tag.replace(/\bsrc="[^"]*"/,'src="'+escapeAttr(src)+'"'):tag;
  });
  // The encrypted v11 content retains its original YouTube code, but the GitHub
  // deployment uses the HTTPS bridge above so YouTube receives a normal Referer.
  html=html.replace(/initializeYouTubePlayers\(\);/g,'/* YouTube is handled by the GitHub bridge. */');
  return html;
}
function installYouTubeBridge(frame){
  const doc=frame.contentDocument,win=frame.contentWindow;
  if(!doc||!win||doc.getElementById('github-youtube-bridge'))return;
  const script=doc.createElement('script');
  script.id='github-youtube-bridge';
  script.textContent=`(() => {
    'use strict';
    const frames=[...document.querySelectorAll('iframe[data-video-id]')];
    const tabForFrame=f=>String(f.id||'').replace(/^player-/,'');
    const byTab=tab=>document.getElementById('player-'+tab);
    function sec(value){const p=String(value||'0').trim().split(':').map(Number);if(p.some(Number.isNaN))return 0;if(p.length===3)return Math.max(0,p[0]*3600+p[1]*60+p[2]);if(p.length===2)return Math.max(0,p[0]*60+p[1]);return Math.max(0,p[0]||0)}
    function status(tab,text){const f=byTab(tab);const label=f?.closest('.player-card')?.querySelector('.player-meta span');if(label)label.textContent=text}
    function pauseFrame(f){if(!f)return;try{if(typeof f.contentWindow?.uyenPauseVideo==='function'){f.contentWindow.uyenPauseVideo();return}}catch(_){}try{f.contentWindow?.postMessage({type:'uyen-yt-pause'},'*')}catch(_){}}
    function pauseAll(except){frames.forEach(f=>{if(f!==except)pauseFrame(f)})}
    function playAt(f,seconds){if(!f)return false;try{if(typeof f.contentWindow?.uyenSeekAndPlay==='function')return f.contentWindow.uyenSeekAndPlay(seconds)!==false}catch(_){}try{f.contentWindow?.postMessage({type:'uyen-yt-seek',seconds},'*');return true}catch(_){return false}}
    function markControl(control){const pane=control.closest('.skill-pane');if(!pane)return;pane.querySelectorAll('button.time').forEach(x=>x.classList.remove('active-time'));pane.querySelectorAll('.segment-jump').forEach(x=>x.classList.remove('active-segment'));pane.querySelectorAll('.tx-row').forEach(x=>x.classList.remove('playing-row'));if(control.classList.contains('time'))control.classList.add('active-time');if(control.classList.contains('segment-jump'))control.classList.add('active-segment');control.closest('.tx-row')?.classList.add('playing-row','is-current')}
    function sync(tab,t){const pane=document.getElementById('pane-'+tab);if(!pane)return;const rows=[...pane.querySelectorAll('.tx-row[data-time]')];let current=null;for(const row of rows){if(sec(row.dataset.time)<=t+0.08)current=row;else break}rows.forEach(r=>r.classList.toggle('is-current',r===current));pane.querySelectorAll('button.time[data-video-time]').forEach(b=>b.classList.toggle('active-time',b.closest('.tx-row')===current));const sections=[...pane.querySelectorAll('.segment-jump[data-video-time]')];let active=null;for(const s of sections){if(sec(s.dataset.videoTime)<=t+0.08)active=s;else break}sections.forEach(s=>s.classList.toggle('active-segment',s===active))}
    document.addEventListener('click',event=>{
      const videoControl=event.target.closest('button.time[data-video-tab][data-video-time],button.segment-jump[data-video-tab][data-video-time]');
      if(videoControl){
        event.preventDefault();event.stopImmediatePropagation();
        const tab=videoControl.dataset.videoTab,f=byTab(tab),seconds=sec(videoControl.dataset.videoTime);
        document.querySelectorAll('audio').forEach(a=>{try{a.pause()}catch(_){}});pauseAll(f);markControl(videoControl);
        if(playAt(f,seconds))status(tab,'Playing from '+videoControl.dataset.videoTime+'.');else status(tab,'Player is still loading. Click the timestamp again in a moment.');
        return;
      }
      if(event.target.closest('.audio-time[data-audio-id],.main-tab-btn,.subtab-btn'))pauseAll(null);
    },true);
    window.addEventListener('message',event=>{
      const frame=frames.find(f=>f.contentWindow===event.source);if(!frame||!event.data)return;const tab=tabForFrame(frame),data=event.data;
      if(data.type==='uyen-yt-ready')status(tab,'Select a transcript time to play from that point.');
      if(data.type==='uyen-yt-not-ready')status(tab,'Player is still loading. Click the timestamp again in a moment.');
      if(data.type==='uyen-yt-autoplay-blocked')status(tab,'Playback was blocked. Press play once in the video, then use the timestamps.');
      if(data.type==='uyen-yt-error')status(tab,'YouTube could not play this video here. Use the YouTube link instead.');
      if(data.type==='uyen-yt-state'&&Number(data.state)===1){document.querySelectorAll('audio').forEach(a=>{try{a.pause()}catch(_){}});pauseAll(frame)}
      if(data.type==='uyen-yt-time')sync(tab,Number(data.seconds)||0);
    });
  })();`;
  doc.body.appendChild(script);
}
async function load(){const pw=sessionStorage.getItem(sessionKey);if(!pw){location.replace('../../?next='+encodeURIComponent('cycles/'+location.pathname.split('/').filter(Boolean).slice(-1)[0]+'/'));return}try{const chunks=[];let key=null,keySalt='';const PARTS=10;for(let i=1;i<=PARTS;i++){const name=`payload-${String(i).padStart(3,'0')}.bin`;const r=await fetch(name,{cache:'no-store'});if(!r.ok)throw new Error('Payload unavailable: '+name);const env=await parseEnvelope(await r.arrayBuffer());const saltId=Array.from(env.salt).join(',');if(!key||saltId!==keySalt){key=await deriveKey(pw,env.salt,env.iters);keySalt=saltId}const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:env.iv},key,env.ct);chunks.push(new Uint8Array(plain))}let total=0;for(const c of chunks)total+=c.length;const all=new Uint8Array(total);let off=0;for(const c of chunks){all.set(c,off);off+=c.length}let html=new TextDecoder().decode(all);html=prepareYouTubeForGitHub(html);
const blob=new Blob([html],{type:'text/html;charset=utf-8'});const blobUrl=URL.createObjectURL(blob);const frame=document.createElement('iframe');frame.title='Cycle 8 study environment';frame.src=blobUrl;frame.style.cssText='display:block;width:100%;height:100%;border:0;background:#f4f1ea;';frame.addEventListener('load',()=>installYouTubeBridge(frame),{once:true});document.documentElement.style.cssText='width:100%;height:100%;margin:0;overflow:hidden;';document.body.style.cssText='width:100%;height:100%;margin:0;overflow:hidden;background:#f4f1ea;';document.body.replaceChildren(frame);window.addEventListener('pagehide',()=>URL.revokeObjectURL(blobUrl),{once:true});
}catch(e){console.error('Cycle load failed',e);sessionStorage.removeItem(sessionKey);document.getElementById('dot').style.display='none';document.getElementById('title').textContent='Unable to open cycle';document.getElementById('msg').innerHTML='The cycle files could not be opened. <a href="../../">Return to login</a>.'}}
load();
</script></body></html>
