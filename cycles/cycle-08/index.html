<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Loading cycle…</title><style>
:root{--bg:#f4f1ea;--paper:#fffdf8;--ink:#17191d;--muted:#6f736f;--line:#d9d5ca;--accent:#a7372d}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}main{width:min(430px,calc(100% - 36px));padding:28px;background:var(--paper);border:1px solid var(--line);border-radius:16px;text-align:center}.dot{width:28px;height:28px;border:3px solid #ddd6ca;border-top-color:var(--accent);border-radius:50%;margin:0 auto 16px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}h1{font-size:20px;margin:0 0 8px}p{font-size:13px;color:var(--muted);line-height:1.5;margin:0}a{color:var(--accent);font-weight:750}</style></head><body><main><div class="dot" id="dot"></div><h1 id="title">Opening cycle</h1><p id="msg">Decrypting the approved study environment in this browser.</p></main><script>
const MAGIC='UYENBIN1',sessionKey='uyen.study.password';
function bytesToText(b){return new TextDecoder().decode(b)}
async function deriveKey(pw,salt,iters){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iters,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt'])}
async function parseEnvelope(buf){const b=new Uint8Array(buf);if(b.length<56||bytesToText(b.slice(0,8))!==MAGIC)throw new Error('Invalid encrypted file');const dv=new DataView(b.buffer,b.byteOffset,b.byteLength);return{iters:dv.getUint32(8,false),salt:b.slice(12,28),iv:b.slice(28,40),ct:b.slice(40)}}
async function load(){const pw=sessionStorage.getItem(sessionKey);if(!pw){location.replace('../../?next='+encodeURIComponent('cycles/'+location.pathname.split('/').filter(Boolean).slice(-1)[0]+'/'));return}try{const chunks=[];let key=null,keySalt='';const PARTS=3;for(let i=1;i<=PARTS;i++){const name=`payload-${String(i).padStart(3,'0')}.bin`;const r=await fetch(name,{cache:'no-store'});if(!r.ok)throw new Error('Payload unavailable');const env=await parseEnvelope(await r.arrayBuffer());const saltId=Array.from(env.salt).join(',');if(!key||saltId!==keySalt){key=await deriveKey(pw,env.salt,env.iters);keySalt=saltId}const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:env.iv},key,env.ct);chunks.push(new Uint8Array(plain))}let total=0;for(const c of chunks)total+=c.length;const all=new Uint8Array(total);let off=0;for(const c of chunks){all.set(c,off);off+=c.length}const html=new TextDecoder().decode(all);document.open();document.write(html);document.close()}catch(e){sessionStorage.removeItem(sessionKey);document.getElementById('dot').style.display='none';document.getElementById('title').textContent='Unable to open cycle';document.getElementById('msg').innerHTML='The password could not decrypt this cycle. <a href="../../">Return to login</a>.'}}
load();
</script></body></html>
